name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # .pwa-assets/ is generated and gitignored, but Doopass.Cli embeds the
      # icons at build time, so a clean clone cannot build without them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the icon set
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow numpy
          python scripts/generate-icons.py

      # The mobile project needs the maui-android workload, the Android SDK and a
      # JDK, so it is built locally only. The solution file is not used here for
      # the same reason: it includes Doopass.Mobile.
      - name: Build the CLI host
        run: dotnet build src/Doopass.Cli/Doopass.Cli.csproj

      - name: Core tests
        run: dotnet test tests/Doopass.Core.Tests/Doopass.Core.Tests.csproj

      - name: TUI tests
        run: dotnet test tests/Doopass.Tui.Tests/Doopass.Tui.Tests.csproj

      - name: API tests
        run: dotnet test tests/Doopass.Api.Tests/Doopass.Api.Tests.csproj

      - name: WebClient tests
        run: dotnet test tests/Doopass.WebClient.Tests/Doopass.WebClient.Tests.csproj
