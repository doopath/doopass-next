name: Release

# Builds the portable archives, the Android APK and SHA256SUMS with
# scripts/publish-release.sh, then attaches them to a GitHub release.
# Runs on a v* tag, or by hand (Actions -> Release -> Run workflow) for an
# existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v5.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Fail before a ten minute build if the tag and the shipped version differ.
      - name: Check the tag against Constants.cs
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' src/Doopass.Core/Constants.cs | head -1)
          [ "v$version" = "$TAG" ] || {
            echo "::error::tag $TAG does not match v$version in src/Doopass.Core/Constants.cs"
            exit 1
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # .pwa-assets/ is generated and gitignored (see ci.yml).
      - name: Generate the icon set
        run: |
          python -m pip install --quiet --disable-pip-version-check pillow numpy
          python scripts/generate-icons.py

      # The runner image already has android-36, build-tools 36.0.0 and JDK 17;
      # the workload is the only missing piece.
      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Build the release artifacts
        run: ./scripts/publish-release.sh

      - name: Attach them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Re-running the job for the same tag replaces the assets instead of
          # failing with "release already exists".
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/github-release/* --clobber
