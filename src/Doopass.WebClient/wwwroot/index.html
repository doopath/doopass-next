<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <link rel="icon" href="/pwa/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/pwa/favicon.svg" />
    <base href="/" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Doopass" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="_content/Doopass.WebUi/theme.js"></script>
    <link rel="stylesheet" href="_content/Doopass.WebUi/app.css" />
    <HeadOutlet />
</head>
<body>
    <!-- The Blazor WebAssembly host mounts the shared app here. -->
    <div id="app" role="application" aria-busy="true">
        <div class="app-splash" aria-hidden="true">Loading Doopass…</div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-hidden="true">✕</span>
    </div>
    <script src="_content/Doopass.WebUi/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
