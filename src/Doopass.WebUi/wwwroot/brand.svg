<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bgBase" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#120C24"/>
      <stop offset="0.45" stop-color="#0B0616"/>
      <stop offset="1" stop-color="#05030B"/>
    </linearGradient>

    <radialGradient id="glowCenter" cx="0" cy="0" r="1" gradientTransform="translate(512 560) scale(430 430)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCorner" cx="0" cy="0" r="1" gradientTransform="translate(210 170) scale(400 400)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientTransform="translate(760 880) scale(420 340)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientTransform="translate(512 500) scale(700 700)" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="shackleGrad" x1="388" y1="292" x2="650" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAF5FF"/>
      <stop offset="0.18" stop-color="#E9D5FF"/>
      <stop offset="0.42" stop-color="#C084FC"/>
      <stop offset="0.72" stop-color="#9B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="shackleRim" x1="512" y1="286" x2="512" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="372" y1="462" x2="648" y2="726" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C287FF"/>
      <stop offset="0.30" stop-color="#AA5CFF"/>
      <stop offset="0.64" stop-color="#8B37EE"/>
      <stop offset="1" stop-color="#641FB8"/>
    </linearGradient>

    <linearGradient id="bodyRim" x1="512" y1="458" x2="512" y2="734" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="topSheen" x1="512" y1="458" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassSweep" x1="380" y1="458" x2="640" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.00"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.60" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="keyholeGrad" x1="512" y1="524" x2="512" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241145"/>
      <stop offset="0.5" stop-color="#120827"/>
      <stop offset="1" stop-color="#06030D"/>
    </linearGradient>

    <linearGradient id="ringGrad" x1="230" y1="240" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#C084FC" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="floorGlow" cx="0" cy="0" r="1" gradientTransform="translate(512 762) scale(230 60)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur46" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur14" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>

    <clipPath id="bodyClip">
      <rect x="356" y="458" width="312" height="276" rx="78"/>
    </clipPath>

    <path id="shacklePath" d="M398 528V424a114 114 0 0 1 228 0v104" fill="none"/>

    <g id="lockSilhouette">
      <path d="M398 528V424a114 114 0 0 1 228 0v104" fill="none" stroke="#8B5CF6" stroke-width="52" stroke-linecap="round"/>
      <rect x="356" y="458" width="312" height="276" rx="78" fill="#8B5CF6"/>
    </g>

    <path id="keyholePath" d="M512 515a35 35 0 0 1 35 35c0 13.6-7.7 25.3-18.9 31l13.2 44.9a9.2 9.2 0 0 1-8.9 11.6h-40.8a9.2 9.2 0 0 1-8.9-11.6l13.2-44.9C484.7 575.3 477 563.6 477 550a35 35 0 0 1 35-35z"/>
  </defs>

  <!-- background -->
  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="url(#bgBase)"/>
    <rect width="1024" height="1024" fill="url(#glowCenter)"/>
    <rect width="1024" height="1024" fill="url(#glowCorner)"/>
    <rect width="1024" height="1024" fill="url(#glowBottom)"/>

    <!-- thin orbital accents -->
    <circle cx="512" cy="512" r="332" stroke="url(#ringGrad)" stroke-width="1.6" opacity="0.55"/>
    <path d="M258.4 299.9A332 332 0 0 1 765.6 299.9" stroke="#C084FC" stroke-width="2.2" opacity="0.55" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="368" stroke="#A855F7" stroke-width="1" opacity="0.10"/>

    <!-- grain -->
    <rect width="1024" height="1024" filter="url(#grain)" opacity="0.045" style="mix-blend-mode:overlay"/>

    <!-- ambient bloom -->
    <ellipse cx="512" cy="740" rx="250" ry="70" fill="url(#floorGlow)" filter="url(#blur24)" opacity="0.7"/>
    <use href="#lockSilhouette" filter="url(#blur46)" opacity="0.55"/>
    <use href="#lockSilhouette" filter="url(#blur24)" opacity="0.35"/>

    <!-- lock -->
    <g>
      <rect x="356" y="484" width="312" height="266" rx="78" fill="#2A0E52" opacity="0.55" filter="url(#blur24)"/>

      <use href="#shacklePath" stroke="url(#shackleGrad)" stroke-width="52" stroke-linecap="round"/>
      <use href="#shacklePath" stroke="url(#shackleRim)" stroke-width="14" stroke-linecap="round" filter="url(#soft2)" opacity="0.9" transform="translate(0 -7)"/>

      <rect x="356" y="458" width="312" height="276" rx="78" fill="url(#bodyGrad)"/>

      <g clip-path="url(#bodyClip)">
        <rect x="356" y="458" width="312" height="150" fill="url(#topSheen)"/>
        <path d="M356 700 L668 520 L668 734 L356 734 Z" fill="url(#glassSweep)"/>
        <ellipse cx="430" cy="500" rx="120" ry="46" fill="#FFFFFF" opacity="0.10" filter="url(#blur14)" transform="rotate(-18 430 500)"/>
      </g>

      <rect x="357.5" y="459.5" width="309" height="273" rx="76.5" stroke="url(#bodyRim)" stroke-width="3"/>

      <!-- keyhole -->
      <g transform="translate(0 16)">
        <use href="#keyholePath" fill="#000000" opacity="0.35" filter="url(#soft2)" transform="translate(0 -4)"/>
        <use href="#keyholePath" fill="url(#keyholeGrad)"/>
        <use href="#keyholePath" stroke="#E9D5FF" stroke-width="1.6" opacity="0.28"/>
      </g>

      <!-- glints -->
      <path d="M424 318c1.6 8.4 3.8 10.6 12.2 12.2-8.4 1.6-10.6 3.8-12.2 12.2-1.6-8.4-3.8-10.6-12.2-12.2 8.4-1.6 10.6-3.8 12.2-12.2z" fill="#FFFFFF" opacity="0.55"/>
      <path d="M640 356c1.1 5.8 2.6 7.3 8.4 8.4-5.8 1.1-7.3 2.6-8.4 8.4-1.1-5.8-2.6-7.3-8.4-8.4 5.8-1.1 7.3-2.6 8.4-8.4z" fill="#FFFFFF" opacity="0.30"/>
    </g>

    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>

  <!-- outer hairline -->
  <rect x="0.8" y="0.8" width="1022.4" height="1022.4" rx="223.4" stroke="#C084FC" stroke-opacity="0.16" stroke-width="1.6"/>
</svg>
